# golangci-lint configuration for the Soapbox engine.
#
# The rule set is deliberately conservative: correctness, error handling, and
# security checks only. Two project invariants are encoded here and are also
# asserted by go test in tools/soapbox_test.go, so neither a lint skip nor a
# missing lint binary can weaken them:
#
#  1. Maintained executable logic is Go. No command may be composed through sh,
#     bash, or -c, and os/exec is confined to the git, go, and doctor
#     boundaries.
#  2. TLS certificate verification is never disabled.
#
# Tool pinning: the linter is not pinned through a Go tool directive. Doing so
# would add golangci-lint and its several hundred analyser modules to the engine
# module graph, which every go mod tidy, go test, and go build would then have to
# resolve, and the engine deliberately depends on one library. goimports needs no
# pin either, because golangci-lint runs it through the formatters section below
# and gofmt ships with the pinned toolchain. The linter release is pinned in
# .github/workflows/ci.yml instead, which runs it as go run <module>@<version>.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - predeclared
    - reassign
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars

  settings:
    depguard:
      rules:
        subprocess-boundary:
          files:
            - $all
            - "!**/internal/gitcli/*.go"
            - "!**/internal/gocli/*.go"
            - "!**/internal/doctor/*.go"
          deny:
            - pkg: os/exec
              desc: subprocess execution belongs in internal/gitcli and internal/gocli, which are the only Git, Go toolchain, and credential boundaries
        no-shell-helpers:
          files:
            - $all
          deny:
            - pkg: github.com/mvdan/sh
              desc: the engine never interprets shell
            - pkg: mvdan.cc/sh
              desc: the engine never interprets shell

    errcheck:
      check-type-assertions: true
      check-blank: true

    forbidigo:
      analyze-types: true
      forbid:
        # A subprocess without a context cannot be canceled, and every engine
        # entry point already carries one.
        - pattern: ^exec\.Command$
          msg: use exec.CommandContext so subprocesses honour context cancellation
        - pattern: ^os\.Exit$
          msg: return an error and let cmd/soapbox decide the process exit code
        - pattern: ^log\.(Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          msg: return an error instead of terminating the process
        - pattern: ^panic$
          msg: return an error, engine code never panics on input

    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - appendAssign

    gosec:
      config:
        # Reject anything that turns off certificate verification.
        G402:
          # 0 means TLS 1.0 is not accepted as a minimum version.
          tls_min_version: 771

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    staticcheck:
      checks:
        - all

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # internal/gitcli, internal/gocli, and internal/doctor are the only
      # packages allowed to start processes, so the subprocess audit is expected
      # to fire there.
      - path: internal/(gitcli|gocli|doctor)/
        linters:
          - gosec
        text: G204
      # cmd/soapbox is the one place that turns an engine exit code into a
      # process exit code.
      - path: cmd/soapbox/main\.go
        linters:
          - forbidigo
        text: os.Exit
      # These reads are the point of the commands that perform them: profile,
      # engine, and checksum paths come from the operator's command line, and the
      # allowed signers path comes from the inspected repository's own git
      # configuration, which is the file git itself would read.
      - path: internal/config/config\.go
        linters:
          - gosec
        text: G304
      - path: internal/cli/upgrade\.go
        linters:
          - gosec
        text: G304
      - path: internal/doctor/doctor\.go
        linters:
          - gosec
        text: G304
      # Test fixtures create files and directories that only ever live under a
      # test temporary directory.
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/enj/soapbox
